<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Plasticity MCP local CAD workflow</title>
  <desc id="description">An MCP client connects to a local bridge that uses Plasticity for native CAD. An optional Workbench supports review, feedback, and print preparation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset="1" stop-color="#13283a"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop offset="0" stop-color="#42d8c0"/>
      <stop offset="1" stop-color="#85b9ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#365064" stroke-opacity=".24"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#4b6678" stroke-opacity=".55"/>

  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" opacity=".8">
    <path d="m92 104 72-40 72 40-72 40z"/>
    <path d="M92 104v82l72 40 72-40v-82M164 144v82"/>
    <path d="m127 84 73 42M200 84l-73 42"/>
  </g>
  <circle cx="164" cy="144" r="4" fill="#42d8c0"/>
  <text x="70" y="274" fill="#f4f9fc" font-family="system-ui, -apple-system, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">Plasticity MCP</text>
  <text x="73" y="309" fill="#b5c8d4" font-family="system-ui, -apple-system, sans-serif" font-size="23">Native CAD through a local MCP server</text>

  <text x="628" y="73" fill="#8ec9d7" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="650" letter-spacing="2">RUNS ON YOUR MAC</text>
  <g fill="#142d3d" stroke="#517287" stroke-width="2">
    <rect x="625" y="103" width="155" height="114" rx="16"/>
    <rect x="822" y="103" width="155" height="114" rx="16"/>
    <rect x="1019" y="103" width="155" height="114" rx="16"/>
  </g>
  <g fill="#f4f9fc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="650" text-anchor="middle">
    <text x="702" y="152">MCP client</text>
    <text x="899" y="152">Local bridge</text>
    <text x="1096" y="152">Plasticity</text>
  </g>
  <g fill="#a9c0ce" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle">
    <text x="702" y="185">requests</text>
    <text x="899" y="185">stdio + CDP</text>
    <text x="1096" y="185">native CAD</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M787 160h25m-8-8 8 8-8 8"/>
    <path d="M984 160h25m-8-8 8 8-8 8"/>
  </g>
  <rect x="625" y="248" width="549" height="64" rx="14" fill="#122536" stroke="#426779" stroke-width="2"/>
  <text x="648" y="287" fill="#d7eaf2" font-family="system-ui, -apple-system, sans-serif" font-size="21">
    Optional Workbench  ·  review  ·  feedback  ·  print prep
  </text>
</svg>
